id = "com.leviathan.maki.notes"
name = "Notes"
version = 2
label = "1.1"
api = 1
storage = 64
memory = 256
backup = true
description = "Secrets you read on maki, never on the computer again: recovery codes, PINs, a safe's combination. Send one from maki desktop, which forgets it, or scan it; Type it types one into a field when you pick it."
icon = "icon.pbm"

[permissions]
ask = "To ask you before it keeps a note your computer sends."
camera = "To read a note from a QR code when you pick Scan a note."
keyboard = "To type a note into your computer when you pick Type it."
link = "So maki desktop can send it notes, and see their titles (never what they say)."
