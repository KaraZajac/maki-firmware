[package]
name = "ton"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# std, for an allocator: the account's code (maki-ton) works in Vecs and Strings
maki-app = { path = "../../maki-app", default-features = false, features = ["std", "wallet"] }
# what its wallets sign, read strictly and shown before it's signed; maki holds the key
maki-ton = { path = "../../../libs/maki-ton" }
