id = "com.leviathan.maki.bitcoin"
name = "Bitcoin"
version = 3
label = "1.2"
api = 3
storage = 32
memory = 1024
backup = true
icon = "icon.pbm"
description = "Your Bitcoin wallet, from maki's recovery phrase: native SegWit and taproot accounts, and a key for multisig wallets, for Sparrow, Bitcoin Core and maki desktop, by cable or QR codes alone; every payment, the change and the fee shown on maki before it signs."

[permissions]
camera = "To read transactions off your wallet software's screen, to sign with no cable."
link = "So maki desktop and your wallet software can ask for your account, addresses and signatures."
wallet = "To sign the transactions you approve on maki's screen, and nothing else."

[wallet]
paths = ["m/84'/0'", "m/86'/0'", "m/48'/0'", "m/84'/1'", "m/86'/1'", "m/48'/1'"]
