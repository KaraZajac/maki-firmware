[package]
name = "solana"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# std, for an allocator: the account's code (maki-sol) works in Vecs and Strings
maki-app = { path = "../../maki-app", default-features = false, features = ["std", "wallet"] }
# transactions and messages, read strictly and shown before they're signed; maki holds the key
maki-sol = { path = "../../../libs/maki-sol" }
