camera = "To read what MetaMask asks it to sign off its screen, with no cable."
link = "So sites (through the maki extension) and maki desktop can ask for your account and signatures."
wallet = "To sign the transactions and messages you approve on maki's screen, and nothing else."

[wallet]
paths = ["m/44'/60'"]
