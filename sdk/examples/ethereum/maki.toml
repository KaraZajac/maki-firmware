id = "com.leviathan.maki.ethereum"
name = "Ethereum"
version = 2
label = "1.1"
api = 3
storage = 1
memory = 1024
backup = true
icon = "icon.pbm"
description = "Your Ethereum account, from maki's recovery phrase, as MetaMask and Ledger make it: for sites through the maki extension, maki desktop's wallet, and MetaMask by QR codes. Every transaction, message and permit is shown on maki before it signs."

