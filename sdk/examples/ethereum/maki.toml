id = "com.leviathan.maki.ethereum"
name = "Ethereum"
version = 1
label = "1.0"
api = 3
storage = 1
memory = 1024
backup = true
icon = "icon.pbm"
description = "Your Ethereum account, from maki's recovery phrase, as MetaMask and Ledger make it: for sites through the maki extension, and for maki desktop's wallet. Every transaction, message and permit is shown on maki before it signs."

