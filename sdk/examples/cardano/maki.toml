description = "Your Cardano account, from maki's recovery phrase, as Eternl, Lace, Yoroi and Ledger make it: for maki desktop's wallet. Every payment and token, the change, staking, vote delegation, rewards and the fee are shown on maki before it signs; nothing for scripts, pools or governance is signed at all."

