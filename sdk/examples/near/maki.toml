id = "com.leviathan.maki.near"
name = "NEAR"
version = 1
label = "1.0"
api = 6
storage = 0
memory = 256
backup = true
icon = "icon.pbm"
description = "Your NEAR account, from maki's recovery phrase, as MyNearWallet, near-cli and Trust Wallet make it: for maki desktop's wallet. Every NEAR and token payment, contract call, key, stake and fee is shown on maki before it signs, and anything that would hand the account to another is called out."

[permissions]
link = "So maki desktop can ask for your account and signatures."
wallet = "To sign the transactions you approve on maki's screen, and nothing else."

[wallet]
curve = "ed25519"
paths = ["m/44'/397'"]
