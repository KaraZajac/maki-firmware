[package]
name = "age"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
maki-app = { path = "../../maki-app" }
# unwrapping age's X25519 stanzas: HKDF-SHA-256, then ChaCha20-Poly1305 (maki holds the key and
# does the X25519 with keys::x25519_agree)
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
