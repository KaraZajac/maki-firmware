[package]
name = "maki-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Write apps for maki, the DEF CON 34 badge firmware: the screen, buttons, storage and time, for wasm32 or natively"

[features]
default = ["panic-handler"]
# A panic stops the app with its message on maki's screen. Leave it on for #![no_std] apps;
# apps that use std turn it off and get the same from `std`.
panic-handler = []
std = []
# wallets' keys (the wallet permission, host API 3): needs an allocator
wallet = ["dep:maki-hd"]

[dependencies]
maki-hd = { path = "../../libs/maki-hd", optional = true }

# a native app (`kind = "native"`): maki's functions over its app service
[target.'cfg(target_os = "xous")'.dependencies]
xous = "0.9.70"
maki-native = { path = "../../libs/maki-native" }
