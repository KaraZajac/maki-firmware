# maki's app SDK: the crate apps are written with, example apps, and the `maki` tool that packs,
# signs, inspects and simulates them. Apps build for wasm32-unknown-unknown; the tool for the
# computer it runs on.
[workspace]
members = ["maki-app", "maki", "examples/hello", "examples/dice", "examples/tally", "examples/signer", "examples/ssh", "examples/sensors", "examples/hello-native", "examples/pomodoro", "examples/passphrase", "examples/snake", "examples/status", "examples/nostr", "examples/age", "examples/wifi", "examples/bitcoin", "examples/ethereum", "examples/monero", "examples/scanner", "examples/marble", "examples/breakout", "examples/minisign", "examples/notes", "examples/contacts", "examples/openpgp"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
