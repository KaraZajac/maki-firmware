[package]
name = "maki"
version = "0.1.0"
edition = "2021"
description = "Make maki apps: pack and sign .maki bundles, inspect them, and run them in a simulator"

[dependencies]
maki-bundle = { path = "../../libs/maki-bundle" }
maki-wasm = { path = "../../libs/maki-wasm" }
serde = { version = "1", features = ["derive"] }
toml = "1"
png = "0.18"
getrandom = "0.4"
crossterm = "0.29"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
