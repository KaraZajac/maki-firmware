[package]
name = "maki"
version = "0.1.0"
edition = "2021"
description = "Make maki apps: pack and sign .maki bundles, inspect them, and run them in a simulator"

[dependencies]
maki-bundle = { path = "../../libs/maki-bundle" }
maki-wasm = { path = "../../libs/maki-wasm" }
# native apps: the checks maki makes of their ELF, and the firmware they're built for
maki-native = { path = "../../libs/maki-native" }
# apps' keys in the simulator: from the BIP39 test phrase, as maki derives them from yours
maki-seed = { path = "../../libs/maki-seed" }
# the store's records, for `maki store`
maki-store = { path = "../../libs/maki-store" }
sha2 = "0.10.8"
serde = { version = "1", features = ["derive"] }
toml = "1"
png = "0.18"
getrandom = "0.4"
crossterm = "0.29"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
