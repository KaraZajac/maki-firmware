[package]
name = "maki-seed"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "maki's recovery phrase: BIP39 words, the seed, and the keys derived from it"

[dependencies]
sha2 = { version = "0.10.8", default-features = false }
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
hkdf = "0.12.4"
zeroize = "1.8.1"

[dev-dependencies]
serde_json = "1"
