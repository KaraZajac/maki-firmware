[package]
name = "maki-store"
version = "0.1.0"
edition = "2021"
description = "The maki store's signed records (the root, stamps and revocations) and the checks maki makes of them itself"

[dependencies]
maki-bundle = { path = "../maki-bundle" }
# as maki-bundle: the Baochip build of ed25519-dalek 2.x
ed25519-dalek = { package = "ed25519-dalek-compat", path = "../../bao1x-boot/ed25519-dalek-compat", default-features = false }
sha2 = { version = "0.10.8", default-features = false }

[dev-dependencies]
# to read the development store's index in its test
serde_json = "1"
