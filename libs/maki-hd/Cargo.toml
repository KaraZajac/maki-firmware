[package]
name = "maki-hd"
version = "0.1.0"
edition = "2021"
description = "Keys for maki's wallet apps: BIP32 paths from the recovery phrase's seed, and the signatures wallets need"
license = "MIT"

[features]
default = []
# The keys themselves, from a seed: maki-keys, the fake maki, the simulator and tests. Without
# it, only the trait and paths, for apps (which get their keys through maki).
seed = ["dep:k256", "dep:hmac", "dep:sha2", "dep:ripemd", "dep:zeroize", "dep:maki-xmr", "dep:ed25519-dalek"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "sha256", "alloc", "schnorr"], optional = true }
hmac = { version = "0.12.1", optional = true }
sha2 = { version = "0.10.8", default-features = false, optional = true }
ripemd = { version = "0.1", default-features = false, optional = true }
zeroize = { version = "1.8.1", optional = true }
# Monero's keys, from the key at m/44'/128'/account'/0/0
maki-xmr = { path = "../maki-xmr", features = ["keys"], optional = true }
# Ed25519 keys (SLIP-10), for Solana: the Baochip build the app host's Ed25519 keys use
ed25519-dalek = { package = "ed25519-dalek-compat", path = "../../bao1x-boot/ed25519-dalek-compat", default-features = false, features = ["zeroize"], optional = true }

[dev-dependencies]
# its own tests are of the keys: `cargo test -p maki-hd` builds them with `seed`
maki-hd = { path = ".", features = ["seed"] }
maki-seed = { path = "../maki-seed" }
bitcoin = "0.32"
sha3 = { version = "0.10.8", default-features = false }
maki-xmr = { path = "../maki-xmr" }
