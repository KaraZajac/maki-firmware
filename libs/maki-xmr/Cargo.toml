[package]
name = "maki-xmr"
version = "0.1.0"
edition = "2021"
description = "Monero for maki: addresses and subaddresses, and (with `keys`) the keys and 25-word backup maki-keys makes from the recovery phrase"
license = "MIT OR Apache-2.0"

[features]
default = []
# The keys, as Ledger's Monero app makes them from the recovery phrase, subaddresses and the 25
# words: maki-keys (through maki-hd), the fake maki, the simulator and tests. Without it, only
# addresses, for the Monero app.
keys = ["dep:curve25519-dalek", "dep:zeroize", "dep:crypto-bigint", "dep:subtle"]

[dependencies]
sha3 = { version = "0.10.8", default-features = false }
curve25519-dalek = { package = "curve25519-dalek-bao1x", path = "../../bao1x-boot/curve25519-dalek-bao1x", default-features = false, features = ["zeroize", "alloc"], optional = true }
zeroize = { version = "1.8.1", default-features = false, optional = true }
# the field arithmetic of Monero's hash onto the curve, which dalek keeps to itself
crypto-bigint = { version = "0.5.5", default-features = false, optional = true }
subtle = { version = "2.6", default-features = false, optional = true }

[dev-dependencies]
# its own tests are of the keys too: `cargo test -p maki-xmr` builds them with `keys`
maki-xmr = { path = ".", features = ["keys"] }
# monero-rs, to hold ours to: addresses and subaddresses, and outputs' one-time keys
monero = "0.22"
# monero-oxide's CLSAG verifier, to check the signatures maki makes
monero-clsag = "0.1.0"
monero-ed25519 = "0.1.0"
# and its Bulletproofs+ verifier, the range proofs maki makes
monero-bulletproofs = "0.1.0"
# and its transactions, to read maki's (their hashes, what's signed) and its ring signatures
monero-oxide = "0.1.0"
rand_core = { version = "0.6", features = ["getrandom"] }

[[example]]
name = "bench"
required-features = ["keys"]
