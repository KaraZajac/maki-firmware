[package]
name = "maki-proto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "maki's serial protocol: framing, messages, and the device-side logic"

[dependencies]
roughtime = { path = "../roughtime" }
# imports: the names the vault keeps records under, and the secrets wiped when they go
sha2 = { version = "0.10.8" }
zeroize = "1.8.1"

[dev-dependencies]
# OpenSK's own CBOR reader and writer, to hold the passkeys maki writes to what OpenSK takes
cbor = { path = "../../apps-baosec/vault2/libraries/cbor", package = "cbor-vault2" }
# and P-256, as OpenSK's signing has it, to hold maki's check of a private key to
p256 = { version = "0.11.1", default-features = false, features = ["ecdsa", "ecdh", "std"] }
# fake_maki computes real TOTP codes, the way the vault does, and makes wallet apps' keys as maki-keys does
hmac = "0.12.1"
sha1 = "0.10.6"
maki-hd = { path = "../maki-hd", features = ["seed"] }
maki-seed = { path = "../maki-seed" }
# and checks app bundles as maki's app host does
maki-bundle = { path = "../maki-bundle" }
maki-wasm = { path = "../maki-wasm" }
# and the maki store's records: stamps, roots, revocation lists
maki-store = { path = "../maki-store" }

[features]
# the fake maki's shortcut past Roughtime (Device::trust_platform_clock); never for the badge
fake = []

[[example]]
name = "fake_maki"
required-features = ["fake"]
