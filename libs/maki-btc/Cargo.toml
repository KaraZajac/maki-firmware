[package]
name = "maki-btc"
version = "0.1.0"
edition = "2021"
description = "maki's Bitcoin wallet: keys from the recovery phrase, addresses, and PSBTs reviewed before they're signed"

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "sha256", "alloc"] }
sha2 = { version = "0.10.8", default-features = false }
ripemd = { version = "0.1", default-features = false }
hmac = "0.12.1"
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
zeroize = "1.8.1"

[dev-dependencies]
maki-seed = { path = "../maki-seed" }
bitcoin = "0.32"
miniscript = "12"
