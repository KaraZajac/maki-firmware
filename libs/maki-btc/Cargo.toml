[package]
name = "maki-btc"
version = "0.1.0"
edition = "2021"
description = "maki's Bitcoin wallet: accounts from maki's keys, addresses, and PSBTs reviewed before they're signed"

[dependencies]
maki-hd = { path = "../maki-hd" }
sha2 = { version = "0.10.8", default-features = false }
ripemd = { version = "0.1", default-features = false }
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
# multisig: the other keys' addresses, from the xpubs their wallets gave (BIP32's public derivation)
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
hmac = "0.12.1"

[dev-dependencies]
maki-hd = { path = "../maki-hd", features = ["seed"] }
maki-seed = { path = "../maki-seed" }
bitcoin = { version = "0.32", features = ["bitcoinconsensus"] }
miniscript = "12"
