[package]
name = "maki-wasm"
version = "0.1.0"
edition = "2021"
description = "maki's app host core: runs .maki WebAssembly apps with wasmi, giving them only maki's functions"

[dependencies]
# native apps' ELF, which `admit` checks too
maki-native = { path = "../maki-native", default-features = false }
# Untrusted code: every module validated; "can't happen" paths panic instead of being undefined
# behaviour (extra-checks); a plain dispatch loop rather than tail calls, which depend on the
# optimiser for their stack use. Neither wat nor memory64: modules come compiled and 32-bit.
wasmi = { version = "2.0", default-features = false, features = [
    "std",
    "validate",
    "extra-checks",
    "portable-dispatch",
] }
maki-bundle = { path = "../maki-bundle" }
# wallet apps' paths (host API 3)
maki-hd = { path = "../maki-hd" }
# apps' Ed25519 keys (the keys permission): the Baochip build, as maki-bundle has it
ed25519-dalek = { package = "ed25519-dalek-compat", path = "../../bao1x-boot/ed25519-dalek-compat", default-features = false, features = ["zeroize"] }
zeroize = "1.8.1"
# apps' BIP340 (Schnorr, secp256k1) keys: Nostr's and Taproot's, as maki-btc signs Taproot with
k256 = { version = "0.13", default-features = false, features = ["schnorr"] }
# and the tag that keeps them apart from the same label's Ed25519 key
sha2 = { version = "0.10.8", default-features = false }
# apps' X25519 keys (age's): Montgomery points, from the Baochip build of curve25519-dalek that
# the Ed25519 keys use (the tree's patched curve25519-dalek is the Precursor's)
curve25519-dalek = { package = "curve25519-dalek-bao1x", path = "../../bao1x-boot/curve25519-dalek-bao1x", default-features = false, features = ["zeroize"] }
# maki's own fonts, so apps look the same in the simulator as on maki
blitstr2 = { path = "../blitstr2", features = ["board-baosec", "bao1x"] }
qrcode = { version = "0.12", default-features = false }

# timing each step of loading an app, for finding what's slow on maki
log = { version = "0.4", optional = true }

[features]
trace = ["log"]

[dev-dependencies]
wat = "1"
# the Age example's test wraps file keys as age does, with an X25519 of its own
hkdf = "0.12"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets"] }
sha2 = { version = "0.10.8", default-features = false }
# wallet apps' keys (host API 3), from the BIP39 test phrase, as maki-keys makes them
maki-hd = { path = "../maki-hd", features = ["seed"] }
maki-seed = { path = "../maki-seed" }
# Monero addresses, to check what the Monero app shows
maki-xmr = { path = "../maki-xmr" }
