[package]
name = "maki-xrp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "maki's XRP account: its addresses, and what it signs, read strictly and shown first"

[dependencies]
# addresses (RIPEMD-160 of SHA-256, and SHA-256 twice for their checksum), and what's signed
# (SHA-512's first half)
sha2 = { version = "0.10.8", default-features = false }
ripemd = { version = "0.1", default-features = false }

[dev-dependencies]
maki-hd = { path = "../maki-hd", features = ["seed"] }
maki-seed = { path = "../maki-seed" }
serde_json = "1"
