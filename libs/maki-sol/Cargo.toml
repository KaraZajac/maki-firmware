[package]
name = "maki-sol"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "maki's Solana account: its address, and the transactions and messages it signs, read strictly and shown first"

[dependencies]
# a program's addresses (PDAs): a token account's, proven to be its owner's
sha2 = { version = "0.10.8", default-features = false }
curve25519-dalek = { package = "curve25519-dalek-bao1x", path = "../../bao1x-boot/curve25519-dalek-bao1x", default-features = false }

[dev-dependencies]
maki-hd = { path = "../maki-hd", features = ["seed"] }
maki-seed = { path = "../maki-seed" }
ed25519-dalek = { package = "ed25519-dalek-compat", path = "../../bao1x-boot/ed25519-dalek-compat", default-features = false, features = ["zeroize"] }
serde_json = "1"
