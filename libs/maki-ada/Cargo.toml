[package]
name = "maki-ada"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "maki's Cardano account: its addresses, and what it signs, read strictly and shown first"

[dependencies]
# keys' and scripts' hashes (BLAKE2b-224), and a transaction's ID, what's signed (BLAKE2b-256)
blake2 = { version = "0.10.6", default-features = false }

[dev-dependencies]
maki-hd = { path = "../maki-hd", features = ["seed"] }
maki-seed = { path = "../maki-seed" }
serde_json = "1"
