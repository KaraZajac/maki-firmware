[package]
name = "maki-bundle"
version = "0.1.0"
edition = "2021"
description = "maki's .maki app bundles: manifest, code, icon and the developer's signature, read strictly and checked"

[dependencies]
# as roughtime: the Baochip build of ed25519-dalek 2.x
ed25519-dalek = { package = "ed25519-dalek-compat", path = "../../bao1x-boot/ed25519-dalek-compat", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
# derivation paths, for the wallet permission
maki-hd = { path = "../maki-hd" }
